name: relecture_refus_poisson
description: "Refus répétés du poisson → « n'aime pas le poisson » retenu (en direct ou par la relecture de fin de session)"
memory:
  foyer: "2 adultes"
  frequence_courses: "toutes les semaines"
  ustensile: [four]
steps:
  - start: shopping
  - say: "Cette semaine 4 dîners. Propose-moi un plat avec du saumon."
    expect:
      tools: [propose_recipe]
  - reject_pending: "bof, le poisson c'est pas trop notre truc en fait"
  - say: "Et un plat avec du cabillaud, tu crois que ça passerait ?"
  - reject_pending: "non, vraiment, pas de poisson"
  - new_session: true
checks:
  memory_contains:
    naime_pas: "poisson"
