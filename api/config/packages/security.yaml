security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Firewall dédié à la connexion : login_throttling ne doit s'appliquer qu'ici,
        # sinon il bloquerait aussi les requêtes authentifiées par JWT de l'utilisateur ciblé.
        login:
            pattern: ^/auth/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
            # Anti brute-force : 5 échecs par minute (par email + IP) → 429.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
        main:
            # API sans session : chaque requête porte son JWT (header "Authorization: Bearer <token>").
            stateless: true
            provider: app_user_provider
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: /auth/refresh

    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # Fixture du chat : route déclarée uniquement en env dev (404 ailleurs).
        - { path: ^/dev/chat-fixture$, roles: PUBLIC_ACCESS }
        - { path: ^/auth/(register|login|refresh)$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Coût minimal en test pour accélérer les tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            login:
                login_throttling:
                    max_attempts: 1000
